<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Delivery - MedicoCare</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="back-nav">
        <button onclick="goBack()">← Back</button>
        <span>MedicoCare</span>
    </div>

    <main class="page-container">
        <h2 class="section-title">Order Medicines</h2>

        <div class="card-container">
            <div class="info-card">
                <img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?q=80&w=600&auto=format&fit=crop" alt="Paracetamol">
                <div class="info-content">
                    <div>
                        <h3>Paracetamol 650mg</h3>
                        <p>Fever and pain relief medicine</p>
                    </div>
                    <button class="btn">Order Now</button>
                </div>
            </div>

            <div class="info-card">
                <img src="https://images.unsplash.com/photo-1550572017-edd951b55104?q=80&w=600&auto=format&fit=crop" alt="Vitamins">
                <div class="info-content">
                    <div>
                        <h3>Multivitamins</h3>
                        <p>Boost immunity and daily energy</p>
                    </div>
                    <button class="btn">Order Now</button>
                </div>
            </div>

            <div class="info-card">
                <img src="https://images.unsplash.com/photo-1471864190281-a93a3070b6de?q=80&w=600&auto=format&fit=crop" alt="Antibiotics">
                <div class="info-content">
                    <div>
                        <h3>Antibiotics Pack</h3>
                        <p>Infection treatment medicines</p>
                    </div>
                    <button class="btn">Order Now</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
